name: Build Unsigned IPA for 3uTools

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную через сайт GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true # Обязательно скачиваем тяжелые файлы .a через LFS

    - name: Install Xcode
      run: |
        # Используем предустановленный Xcode
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Clean and Build Xcode Project
      run: |
        # Собираем архив (.xcarchive) без подписи
        xcodebuild archive \
          -project Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -configuration Release \
          -archivePath $GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Create Unsigned IPA Package
      run: |
        # Создаем структуру папок для 3uTools
        mkdir -p $GITHUB_WORKSPACE/build/Payload
        
        # Копируем скомпилированное приложение в Payload
        cp -R $GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive/Products/Applications/Unity-iPhone.app $GITHUB_WORKSPACE/build/Payload/
        
        # Запаковываем папку Payload в zip-архив и меняем расширение на .ipa
        cd $GITHUB_WORKSPACE/build
        zip -r unsigned_app.ipa Payload

    - name: Upload IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa-build
        path: build/unsigned_app.ipa
        retention-days: 7 # Ссылка на скачивание будет доступна неделю
